openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: photo-help
    description: Temporary multimodal schoolwork analysis and teaching help
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /photo-analysis:
    post:
      operationId: analyzePhoto
      tags: [photo-help]
      summary: Classify and extract visible schoolwork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoAnalysisInput"
      responses:
        "200":
          description: Editable extraction for student review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoExtraction"
        "400":
          description: Invalid or unreadable image
        "502":
          description: Vision provider failed
  /photo-help:
    post:
      operationId: createPhotoHelp
      tags: [photo-help]
      summary: Generate teaching help from student-approved extraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoHelpInput"
      responses:
        "200":
          description: Classification-appropriate learning help
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoHelpResult"
        "400":
          description: Invalid reviewed extraction
        "502":
          description: AI provider failed
  /project-plan:
    post:
      operationId: createProjectPlan
      tags: [photo-help]
      summary: Build a project plan after the student chooses a direction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPlanInput"
      responses:
        "200":
          description: Personalized plan based on the selected direction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPlanResult"
        "400":
          description: Invalid project direction
        "502":
          description: AI provider failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SchoolworkKind:
      type: string
      enum: [worksheet_problem, assignment_project, concept_topic]
    PhotoAnalysisInput:
      type: object
      properties:
        imageDataUrl:
          type: string
          minLength: 20
        studentRequest:
          type: string
        selectedMode:
          type: string
          enum: [assignment, concept]
      required: [imageDataUrl, studentRequest, selectedMode]
    PhotoExtraction:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/SchoolworkKind"
        title:
          type: string
        directions:
          type: string
        visibleContent:
          type: string
        gradeLevel:
          type: string
        subject:
          type: string
        skill:
          type: string
        requirements:
          type: array
          items:
            type: string
        readable:
          type: boolean
        note:
          type: string
      required: [kind, title, directions, visibleContent, gradeLevel, subject, skill, requirements, readable, note]
    PhotoHelpInput:
      type: object
      properties:
        extraction:
          $ref: "#/components/schemas/PhotoExtraction"
        studentRequest:
          type: string
      required: [extraction, studentRequest]
    PhotoHelpResult:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/SchoolworkKind"
        heading:
          type: string
        explanation:
          type: array
          items:
            type: string
        keyIdeas:
          type: array
          items:
            type: string
        exampleProblem:
          type: string
        exampleSteps:
          type: array
          items:
            type: string
        exampleAnswer:
          type: string
        actualProblems:
          type: array
          items:
            type: object
            properties:
              problem:
                type: string
              steps:
                type: array
                items:
                  type: string
              answer:
                type: string
            required: [problem, steps, answer]
        guidedTry:
          type: string
        understandingCheck:
          type: string
        summary:
          type: string
        planSteps:
          type: array
          items:
            type: string
        projectIdeas:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              description:
                type: string
              approach:
                type: string
              whyItFits:
                type: string
            required: [title, description, approach, whyItFits]
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ResearchResource"
        detectedCitationStyle:
          type: string
          enum: [MLA, APA, Chicago, Not specified]
      required: [kind, heading, explanation, keyIdeas, exampleProblem, exampleSteps, exampleAnswer, actualProblems, guidedTry, understandingCheck, summary, planSteps, projectIdeas, resources, detectedCitationStyle]
    ResearchResource:
      type: object
      properties:
        title:
          type: string
        organization:
          type: string
        credibility:
          type: string
        supports:
          type: string
        date:
          type: string
        url:
          type: string
        resourceType:
          type: string
          enum: [article, activity, image, video]
      required: [title, organization, credibility, supports, date, url, resourceType]
    ProjectPlanInput:
      type: object
      properties:
        extraction:
          $ref: "#/components/schemas/PhotoExtraction"
        selectedIdea:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
            approach:
              type: string
            whyItFits:
              type: string
          required: [title, description, approach, whyItFits]
        citationStyle:
          type: string
          enum: [MLA, APA, Chicago]
      required: [extraction, selectedIdea, citationStyle]
    ProjectPlanResult:
      type: object
      properties:
        summary:
          type: string
        planSteps:
          type: array
          items:
            type: string
      required: [summary, planSteps]

