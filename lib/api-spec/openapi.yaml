openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: photo-help
    description: Temporary multimodal schoolwork analysis and teaching help
  - name: concept-help
    description: Adaptive teaching help for typed and spoken student questions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /photo-analysis:
    post:
      operationId: analyzePhoto
      tags: [photo-help]
      summary: Classify and extract visible schoolwork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoAnalysisInput"
      responses:
        "200":
          description: Editable extraction for student review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoExtraction"
        "400":
          description: Invalid or unreadable image
        "502":
          description: Vision provider failed
  /photo-help:
    post:
      operationId: createPhotoHelp
      tags: [photo-help]
      summary: Generate teaching help from student-approved extraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoHelpInput"
      responses:
        "200":
          description: Classification-appropriate learning help
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoHelpResult"
        "400":
          description: Invalid reviewed extraction
        "502":
          description: AI provider failed
  /project-plan:
    post:
      operationId: createProjectPlan
      tags: [photo-help]
      summary: Build a project plan after the student chooses a direction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectPlanInput"
      responses:
        "200":
          description: Personalized plan based on the selected direction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPlanResult"
        "400":
          description: Invalid project direction
        "502":
          description: AI provider failed
  /concept-help:
    post:
      operationId: createConceptHelp
      tags: [concept-help]
      summary: Generate an adaptive concept lesson from a student request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConceptHelpInput"
      responses:
        "200":
          description: Parsed intent and grade-appropriate teaching sequence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConceptHelpResult"
        "400":
          description: Invalid or too-short request
        "502":
          description: AI provider failed
  /concept-answer-check:
    post:
      operationId: checkConceptAnswer
      tags: [concept-help]
      summary: Check a student's concept-practice answer without revealing the solution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConceptAnswerCheckInput"
      responses:
        "200":
          description: Semantic correctness and student-safe feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConceptAnswerCheckResult"
        "400":
          description: Invalid answer-check request
        "502":
          description: AI provider failed
  /problem-answer-reveal:
    post:
      operationId: revealProblemAnswer
      tags: [concept-help, photo-help]
      summary: Reveal reasoning and a final answer after explicit student request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProblemAnswerRevealInput"
      responses:
        "200":
          description: Step-by-step reasoning and final answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemAnswerRevealResult"
        "400":
          description: Invalid reveal request
        "502":
          description: AI provider failed
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SchoolworkKind:
      type: string
      enum: [worksheet_problem, assignment_project, concept_topic]
    PhotoAnalysisInput:
      type: object
      properties:
        imageDataUrl:
          type: string
          minLength: 20
        studentRequest:
          type: string
        selectedMode:
          type: string
          enum: [assignment, concept]
      required: [imageDataUrl, studentRequest, selectedMode]
    PhotoExtraction:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/SchoolworkKind"
        title:
          type: string
        directions:
          type: string
        visibleContent:
          type: string
        gradeLevel:
          type: string
        subject:
          type: string
        skill:
          type: string
        requirements:
          type: array
          items:
            type: string
        readable:
          type: boolean
        note:
          type: string
      required: [kind, title, directions, visibleContent, gradeLevel, subject, skill, requirements, readable, note]
    PhotoHelpInput:
      type: object
      properties:
        extraction:
          $ref: "#/components/schemas/PhotoExtraction"
        studentRequest:
          type: string
      required: [extraction, studentRequest]
    PhotoHelpResult:
      type: object
      properties:
        kind:
          $ref: "#/components/schemas/SchoolworkKind"
        heading:
          type: string
        explanation:
          type: array
          items:
            type: string
        keyIdeas:
          type: array
          items:
            type: string
        exampleProblem:
          type: string
        exampleSteps:
          type: array
          items:
            type: string
        exampleAnswer:
          type: string
        actualProblems:
          type: array
          items:
            type: object
            properties:
              problem:
                type: string
              hints:
                type: array
                items:
                  type: string
            required: [problem, hints]
        guidedTry:
          type: string
        understandingCheck:
          type: string
        summary:
          type: string
        planSteps:
          type: array
          items:
            type: string
        projectIdeas:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              description:
                type: string
              approach:
                type: string
              whyItFits:
                type: string
            required: [title, description, approach, whyItFits]
        resources:
          type: array
          items:
            $ref: "#/components/schemas/ResearchResource"
        detectedCitationStyle:
          type: string
          enum: [MLA, APA, Chicago, Not specified]
        deliverables:
          type: array
          description: Explicit items the student must submit, present, bring, upload, or hand in
          items:
            type: string
        turnInMethod:
          type: string
          description: Explicit submission method or Turn-in method not provided
      required: [kind, heading, explanation, keyIdeas, exampleProblem, exampleSteps, exampleAnswer, actualProblems, guidedTry, understandingCheck, summary, planSteps, projectIdeas, resources, detectedCitationStyle, deliverables, turnInMethod]
    ResearchResource:
      type: object
      properties:
        title:
          type: string
        organization:
          type: string
        credibility:
          type: string
        supports:
          type: string
        date:
          type: string
        url:
          type: string
        resourceType:
          type: string
          enum: [article, activity, image, video]
      required: [title, organization, credibility, supports, date, url, resourceType]
    ProjectPlanInput:
      type: object
      properties:
        extraction:
          $ref: "#/components/schemas/PhotoExtraction"
        selectedIdea:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
            approach:
              type: string
            whyItFits:
              type: string
          required: [title, description, approach, whyItFits]
        citationStyle:
          type: string
          enum: [MLA, APA, Chicago]
      required: [extraction, selectedIdea, citationStyle]
    ProjectPlanResult:
      type: object
      properties:
        summary:
          type: string
        planSteps:
          type: array
          items:
            type: string
      required: [summary, planSteps]
    ConceptHelpInput:
      type: object
      properties:
        studentRequest:
          type: string
          minLength: 3
          maxLength: 2000
      required: [studentRequest]
    ConceptHelpResult:
      type: object
      properties:
        topic:
          type: string
        gradeLevel:
          type: string
        subject:
          type: string
        studentGoal:
          type: string
        heading:
          type: string
        explanation:
          type: array
          minItems: 1
          items:
            type: string
        keyIdeas:
          type: array
          minItems: 2
          items:
            type: string
        exampleProblem:
          type: string
        exampleSteps:
          type: array
          minItems: 2
          items:
            type: string
        exampleAnswer:
          type: string
        guidedTry:
          type: string
        practiceProblem:
          type: string
        practiceHints:
          type: array
          minItems: 2
          items:
            type: string
        practiceSteps:
          type: array
          minItems: 2
          items:
            type: string
        understandingCheck:
          type: string
      required: [topic, gradeLevel, subject, studentGoal, heading, explanation, keyIdeas, exampleProblem, exampleSteps, exampleAnswer, guidedTry, practiceProblem, practiceHints, practiceSteps, understandingCheck]
    ConceptAnswerCheckInput:
      type: object
      properties:
        studentRequest:
          type: string
          minLength: 3
          maxLength: 2000
        topic:
          type: string
        gradeLevel:
          type: string
        subject:
          type: string
        practiceProblem:
          type: string
        context:
          type: string
        studentAnswer:
          type: string
          minLength: 1
          maxLength: 1000
      required: [studentRequest, topic, gradeLevel, subject, practiceProblem, context, studentAnswer]
    ConceptAnswerCheckResult:
      type: object
      properties:
        isCorrect:
          type: boolean
        feedback:
          type: string
      required: [isCorrect, feedback]
    ProblemAnswerRevealInput:
      type: object
      properties:
        flow:
          type: string
          enum: [concept, photo]
        studentRequest:
          type: string
          maxLength: 2000
        topic:
          type: string
        gradeLevel:
          type: string
        subject:
          type: string
        problem:
          type: string
        context:
          type: string
          maxLength: 10000
      required: [flow, studentRequest, topic, gradeLevel, subject, problem, context]
    ProblemAnswerRevealResult:
      type: object
      properties:
        reasoning:
          type: array
          minItems: 1
          items:
            type: string
        answer:
          type: string
      required: [reasoning, answer]

